<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <button
      class="h-7 w-15 border-1 border-black rounded-[5px]"
      onclick="showFoodByName(`shul`)"
    >
      shul

    <button
      class="h-7 w-15 border-1 border-black rounded-[5px]"
      onclick="showFoodByName(`huurai`)"
    >
      huurai
    </button>
    <input
      class="border-1 rounded-[5px]"
      id="seachFood"
      type="text"
      placeholder="hooloo hai..."
    />
    <button
      class="h-7 w-15 border-1 border-black rounded-[5px]"
      onclick="searchFoodBtn()"
    >
      submit
    </button>
    <div class="flex gap-5" id="box"></div>
  </body>
  <script src="API.js"></script>
</html>
